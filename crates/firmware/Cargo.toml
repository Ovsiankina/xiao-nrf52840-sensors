[package]
name = "xiao-firmware"
description = "Runs on the XIAO nRF52840 Sense; powers and reads the sensors the API asks for."
version.workspace = true
edition.workspace = true

[dependencies]
xiao-proto.workspace = true
heapless.workspace = true
embedded-hal-async = "1.0"
embassy-futures = "0.1"

# Board-only. Off the board (cargo test on the host) only the
# hardware-free modules are compiled.
[target.'cfg(target_os = "none")'.dependencies]
embassy-nrf = { version = "0.11", features = ["nrf52840", "time-driver-rtc1", "gpiote", "time"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5.1"
embassy-sync = "0.8"
embassy-usb = "0.6"
nrf-sdc = { version = "0.4", features = ["nrf52840", "peripheral"] }
nrf-mpsl = { version = "0.4", features = ["critical-section-impl"] }
trouble-host = { version = "0.8", default-features = false, features = ["peripheral", "gatt", "derive", "default-packet-pool"] }
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "1.0"
static_cell = "2.1"

[lints]
workspace = true
