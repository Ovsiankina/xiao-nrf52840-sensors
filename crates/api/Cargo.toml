[package]
name = "xiao-api"
description = "What the developer calls: pick the XIAO's sensors, configure them, read them."
version.workspace = true
edition.workspace = true

[features]
# `link::Fake`: a link to a board the test plays, for tests without a
# XIAO, here and downstream. Adds no dependency.
fake = []

[dependencies]
xiao-proto.workspace = true
postcard = { workspace = true, features = ["use-std"] }
serialport = "4.10"
btleplug = "0.13"
tokio = { version = "1", features = ["rt", "time", "sync"] }
futures = "0.3"
uuid = "1"

[lints]
workspace = true
